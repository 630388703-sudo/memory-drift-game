    .panel{position:absolute;z-index:5;left:7%;right:7%;bottom:14%;padding:1.1rem 1.1rem 1.2rem;border:1px solid #f7f3ea66;background:linear-gradient(135deg,#f0eadedb,#d9d6d0c7);backdrop-filter:blur(20px) saturate(.8);box-shadow:0 1.2rem 3rem #17222655;clip-path:polygon(0 0,94% 0,100% 10%,100% 100%,0 100%)}.panel:before{content:"ARCHIVE / READ ONLY";position:absolute;right:1rem;top:.7rem;color:#27323566;font:7px "Courier New",monospace;letter-spacing:.15em}.panel h2{max-width:82%;margin:.45rem 0 .7rem;font:italic 400 clamp(22px,4.4vw,36px)/1.08 Georgia,"Songti SC",serif;letter-spacing:-.025em}.panel p{margin:.45rem 0;font-size:11px;line-height:1.75}.micro{font:8px/1.5 "Courier New",monospace;letter-spacing:.17em;text-transform:uppercase}
    .slots{position:absolute;z-index:5;right:3.5%;top:24%;display:grid;gap:.58rem;color:var(--pale);font:8px "Courier New",monospace}.slots>span{writing-mode:vertical-rl;margin-left:4px;letter-spacing:.14em}.slots i{display:grid;width:20px;height:20px;place-items:center;border:1px solid #f7f3ea77;transform:rotate(45deg);font-style:normal;background:#27323533;transition:.35s}.slots i.on{background:var(--yellow);color:var(--ink);box-shadow:0 0 18px #dfc67b77}.slots i span{transform:rotate(-45deg)}
    .lanes{position:absolute;z-index:5;left:50%;bottom:13%;display:flex;gap:.8rem;transform:translateX(-50%)}.lanes i{width:42px;height:2px;background:#f7f3ea44;transition:.25s}.lanes i.on{background:var(--yellow);box-shadow:0 0 14px var(--yellow);transform:scaleX(1.35)}
    footer{position:absolute;z-index:6;left:6%;right:6%;bottom:3.6%;color:var(--pale);font:8px "Courier New",monospace;letter-spacing:.11em;text-shadow:0 2px 10px #172226}.prompt{margin-bottom:.65rem}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center}.track{height:2px;background:#f7f3ea33;overflow:hidden}.fill{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#efe4bd);transform:scaleX(0);transform-origin:left;transition:transform .3s}

    /* Visual & Interaction V3 — archive editorial typography, richer feedback */
    header{padding-right:15%}
    .sound-toggle{position:absolute;z-index:8;top:4.4%;right:5%;width:34px;height:34px;border:1px solid #f7f3ea66;border-radius:50%;background:#26343888;color:var(--pale);font:14px/1 "Courier New",monospace;backdrop-filter:blur(10px);cursor:pointer;transition:.25s}

    .panel h2{margin:.38rem 0 .42rem;color:#263438;font-family:"STSong","Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;font-size:clamp(1.55rem,6.3vw,2.45rem);font-style:normal;font-weight:500;line-height:1.12;letter-spacing:.035em;text-wrap:balance}

    .focus-pill{display:inline-flex;align-items:center;gap:.35rem;margin-top:.45rem;padding:.28rem .5rem;border:1px solid #c7aa6166;color:#5d522f;font:8px "Courier New",monospace;letter-spacing:.1em}
    .focus-pill:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--yellow);animation:breathe 1s infinite}
    .phase-dots{position:absolute;z-index:5;left:6%;top:10.5%;display:flex;gap:5px}

    .utility-dock{position:absolute;z-index:9;top:10%;right:5%;display:flex;gap:5px;align-items:center}
    .archive-btn{display:grid;grid-auto-flow:column;place-items:center;min-width:30px;height:30px;padding:0 8px;border:1px solid #f7f3ea59;border-radius:2px;background:#26343887;color:var(--pale);font:8px/1 "Courier New",monospace;letter-spacing:.1em;backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px #26343822;cursor:pointer;transition:transform .2s,border-color .2s,color .2s,background .2s}

      guideLayer.classList.add("on");clearTimeout(state.guideTimer);state.guideTimer=setTimeout(hideGuide,stage==="corridor"?8500:6500)

    function englishArchivePanel(){
      const a=nearest(),found=a.d<.13,primed=state.archivePrime===a.i&&!state.read.has(a.i);

      ui.prompt.textContent="ARROWS · MOVE SCANNER   SPACE · PROBE / LOCK";ui.ready.textContent=primed?"ALIGN & LOCK":found?"ANCHOR FOUND":"SCAN READY"

    function applyEnglishPanels(){
      if(state.stage==="archive")englishArchivePanel();
      if(state.stage==="corridor"){
        ui.prompt.textContent="← → SWITCH LANE · ↑ ACCELERATE · ↓ FOCUS · SPACE SCAN";
        ui.ready.textContent=state.pulse>performance.now()?"ROUTE REVEALED":state.chain?"MEMORY CHAIN ×"+state.chain:"SCAN READY";
        if(state.focusUntil>performance.now()){ui.panel.innerHTML="<span class='micro'>TEMPORAL FOCUS · 1.2 SEC</span><h2>Drift pace reduced</h2><p>Read the complete shadow and choose the lane holding the true echo.</p><span class='focus-pill'>FOCUS MODE</span>"}
      }
      if(state.stage==="doors"){const n=["A—307","B—307","NO DATA"];ui.panel.innerHTML="<span class='micro'>CORRIDOR CHECKPOINT</span><h2>Three doors at the end</h2><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.8rem 0'>"+n.map((x,i)=>"<div style='padding:.7rem .2rem;border:1px solid "+(i===state.door?"#c6aa62":"#29363a44")+";text-align:center'>"+x+"</div>").join("")+"</div><p>Use the surviving evidence. No doorway is treated as a failure.</p><div class='evidence-ledger'><span>TIME<br>17:42 / 18:12</span><span>PLACE<br>B—307 / A—307</span><span>FIGURE<br>01 / 02</span></div>";ui.prompt.textContent="← → SELECT DOOR · ↑ / SPACE ENTER";ui.ready.textContent="DOOR SELECT"}
      if(state.stage==="classroom"){const rows=coordinates.map((c,i)=>"<div class='choice-row "+(state.calibrated.has(i)?"done":"")+"'><span>"+["TIME","PLACE","FIGURE"][i]+(i===state.calIndex?" ◇":"")+"</span>"+c.values.map((v,j)=>"<b class='"+(state.calibration[i]===j?"on":"")+"'>"+v.replace(" 人","")+"</b>").join("")+"</div>").join("");ui.panel.innerHTML="<span class='micro'>LOOP "+String(state.calibrated.size+1).padStart(2,"0")+" · TEMPORAL ALIGNMENT</span><h2>Hold the echo in the yellow window</h2><div class='choice-list'>"+rows+"</div><div class='align-meter'><i class='align-zone'></i><i class='align-dot'></i></div><p>Choose a version, then press Space when the moving trace enters yellow.</p>";ui.prompt.textContent="↑ ↓ COORDINATE · ← → ANSWER · SPACE LOCK";ui.ready.textContent=state.calibrated.has(state.calIndex)?"CALIBRATED":"WAIT FOR ALIGN"}
      if(state.stage==="reconstruct"){const v=socketVersion();ui.panel.innerHTML="<span class='micro'>RECONSTRUCTING MEMORY · "+state.placed.size+" / 05</span><h2>Find the fragment's dual socket</h2><div class='fragment-list'>"+pieces.map((x,i)=>"<b class='"+(i===state.pieceIndex?"on ":"")+(state.placed.has(i)?"done":"")+"'>0"+(i+1)+"<br>"+["PHOTO","CLOCK","NAME","VOICE","VOID"][i]+"</b>").join("")+"</div><div class='grid-tip'><span>POSITION "+(state.pieceCursor.x+1)+"×"+(state.pieceCursor.y+1)+"</span><span>"+(v<0?"NO MATCH":"SOCKET "+(v===0?"A":"B"))+"</span></div><p>Move across the grid. Scan a wrong position or attach at either plausible socket.</p>";ui.prompt.textContent="ARROWS · MOVE FRAGMENT   SPACE · SCAN / ATTACH";ui.ready.textContent=v<0?"SCAN GRID":"SNAP · VERSION "+(v===0?"A":"B")}
      if(state.stage==="versions"){const lean=Math.abs(state.bias)<=1?"Evidence remains balanced":state.bias>0?"Your actions lean toward shared memory":"Your actions lean toward personal reconstruction";ui.panel.innerHTML="<span class='micro'>MULTIPLE VERSION · ORIGINAL MEMORY UNKNOWN</span><h2>Choose the version you will preserve</h2><div class='version-list'><article class='"+(state.version===0?"on":"")+"'><h3>Version A</h3><p>17:42 · B-307 · 2 figures<br>Left together · photographed by the other<br>“Wait for me...” belongs to the companion</p></article><article class='"+(state.version===1?"on":"")+"'><h3>Version B</h3><p>18:12 · B-307 · 1 figure<br>Left alone · timer photograph<br>The voice belongs to another recording</p></article></div><p>Both versions fit the surviving evidence.<br><strong>BEHAVIOUR:</strong> "+lean+".</p>";if(state.evidenceOpen)ui.panel.insertAdjacentHTML("beforeend","<div class='evidence-ledger'><span>ANCHORS<br>"+state.read.size+" / 3</span><span>STABLE LOCKS<br>"+(3-state.overloadReads)+"</span><span>BIAS<br>"+(state.bias>0?"SHARED":state.bias<0?"PERSONAL":"BALANCED")+"</span></div>");ui.prompt.textContent="← → SWITCH A / B · ↓ EVIDENCE · SPACE SAVE";ui.ready.textContent="SAVE VERSION"}
      if(state.stage==="finale"){const v=state.finalVersion===0?"Version A · Shared memory":"Version B · Personal reconstruction",cred=Math.max(63,88-Math.min(20,Math.abs(state.bias)*2));ui.panel.innerHTML="<span class='micro'>MEMORY RESTORED · BUT ALTERED</span><h2>Memory restored<br>but altered</h2><p class='result'>You did not retrieve the original memory.<br>You completed a new act of preservation.</p><p>Fragments: 05 / 05<br>Calibration: 03 / 03<br>Saved: "+v+"<br>Archive confidence: "+cred+"%</p><p class='micro'>ORIGINAL MEMORY: UNKNOWN</p>";ui.prompt.textContent="AUTO RESET IN 10 SECONDS · R RESET NOW";ui.ready.textContent="ALTERED"}
    }
    function updateLanguageChrome(){
      document.documentElement.lang=state.locale==="zh"?"zh-CN":"en";
      langButton.innerHTML=(state.locale==="zh"?"EN":"中")+"<span class='key'>L</span>";
      durationMark.textContent=state.locale==="zh"?"预计体验 05—06 分钟":"EST. 05—06 MIN";
      document.querySelector("#dormant p").textContent=state.locale==="zh"?"移动方向键唤醒档案":"MOVE ANY DIRECTION TO WAKE THE ARCHIVE";
      ui.stage.textContent=stageLabelsV4[state.locale][state.stage]||ui.stage.textContent;
      guideButton.title=state.locale==="zh"?"操作引导 H":"Guide H";fullButton.title=state.locale==="zh"?"全屏 F":"Fullscreen F";soundButton.title=state.locale==="zh"?"声音 M":"Sound M";
      document.querySelector(".controls .scan").textContent=state.locale==="zh"?"扫描":"SCAN";
      if(state.stage==="dormant"){ui.prompt.textContent=state.locale==="zh"?"方向键 / WASD 唤醒档案":"ARROWS / WASD · WAKE THE ARCHIVE";ui.ready.textContent="READY"}
    }
    const renderUIV3=renderUI;renderUI=function(){renderUIV3();if(state.locale==="en")applyEnglishPanels();updateLanguageChrome();paceHud.classList.toggle("on",state.stage==="corridor")};
    const setStageV3=setStage;setStage=function(s){setStageV3(s);state.v4Last=performance.now();state.stageEnteredAt=state.v4Last;paceHud.classList.toggle("on",s==="corridor");memoryCaption.classList.remove("on");if(s!=="dormant"&&s!=="finale"&&!state.guideSeen.has(s))setTimeout(()=>{if(state.stage===s)showGuide(s)},420);renderUI()};
    const sayV3=say;say=function(message){if(state.locale==="en"){const pairs=[["LEVEL 01 · 找到三个记忆锚点","LEVEL 01 · LOCATE THREE MEMORY ANCHORS"],["RESONANCE FOUND · 等待标记进入黄色区","RESONANCE FOUND · WAIT FOR THE YELLOW WINDOW"],["MEMORY DRIFT · 共振未对齐，再试一次","MEMORY DRIFT · MISALIGNED, TRY AGAIN"],["ARCHIVE OPENED · 记忆走廊已生成","ARCHIVE OPENED · MEMORY CORRIDOR GENERATED"],["走廊尽头 · 三个入口同时出现","CORRIDOR END · THREE ENTRANCES APPEAR"],["碎片仍未完整 · 走廊折回上一层","FRAGMENTS INCOMPLETE · THE CORRIDOR LOOPS"],["FOCUS · 漂移速度减慢，隐藏影子更清晰","FOCUS · DRIFT SLOWED, HIDDEN SHADOWS CLARIFIED"],["两个版本均符合现存证据","BOTH VERSIONS FIT THE SURVIVING EVIDENCE"],["MEMORY RESTORED · BUT ALTERED","MEMORY RESTORED · BUT ALTERED"]];const p=pairs.find(x=>message===x[0]);if(p)message=p[1]}sayV3(message)};
    function toggleFullscreen(){const root=document.querySelector("#game");if(!document.fullscreenElement){const p=root.requestFullscreen&&root.requestFullscreen();if(p&&p.catch)p.catch(()=>say(state.locale==="zh"?"浏览器未允许全屏":"FULLSCREEN NOT AVAILABLE"))}else if(document.exitFullscreen)document.exitFullscreen()}
    const actionV3=action;action=function(k){
      if(k==="KeyL"){state.locale=state.locale==="zh"?"en":"zh";hideGuide();renderUI();showGuide(state.stage,true);tone(720,.08);return}
      if(k==="KeyH"){if(guideLayer.classList.contains("on"))hideGuide();else showGuide(state.stage,true);tone(580,.06);return}
      if(k==="KeyF"){toggleFullscreen();return}
      if(guideLayer.classList.contains("on")&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(k))hideGuide();
      if(state.stage==="corridor"&&k==="ArrowUp"){state.sprintUntil=performance.now()+1150;state.paceBursts++;tone(760,.07);say(state.locale==="zh"?"MEMORY SURGE · 记忆流速暂时加快":"MEMORY SURGE · TEMPORARY ACCELERATION");renderUI();return}
      actionV3(k)
    };
    langButton.addEventListener("click",()=>action("KeyL"));guideButton.addEventListener("click",()=>action("KeyH"));fullButton.addEventListener("click",()=>action("KeyF"));
    function showMemoryCaption(index){
      const zh=["雨声似乎比记忆中更近。","那天下午，是否有人叫住了我？","还是我只是希望，有人曾经等我。","门后留下的，不一定是原来的下午。"];
      const en=["The rain feels closer than I remember.","Did someone call out to me that afternoon?","Or did I only wish that someone had waited?","What remains behind the door may not be the original afternoon."];
      memoryCaption.innerHTML=(state.locale==="zh"?zh:en)[index]+"<small>MEMORY TRACE 0"+(index+1)+"</small>";memoryCaption.classList.add("on");clearTimeout(state.captionTimer);state.captionTimer=setTimeout(()=>memoryCaption.classList.remove("on"),3600)
    }
    const corridorV3=corridorV2;corridorV2=function(t){
      corridorV3(t);const px=540+(state.lane-1)*285,focus=state.focusUntil>t,sprint=state.sprintUntil>t,bob=Math.sin(t*(focus?.006:.012))*(focus?3:8);
      ctx.save();ctx.globalCompositeOperation="screen";ctx.strokeStyle=sprint?"#efd78888":"#f7f3ea35";ctx.lineWidth=sprint?7:3;for(let i=0;i<(sprint?8:4);i++){const sx=px+(i-3.5)*32;ctx.globalAlpha=.09+i*.015;ctx.beginPath();ctx.moveTo(sx,1715-i*18);ctx.lineTo(540+(sx-540)*.36,1040-i*31);ctx.stroke()}ctx.restore();
      if(seekerArt.complete&&seekerArt.naturalWidth){ctx.save();if(sprint){ctx.globalAlpha=.12;ctx.drawImage(seekerArt,px-145-22,1365+bob,290,435);ctx.drawImage(seekerArt,px-145+18,1365+bob,290,435)}ctx.globalAlpha=focus?.82:.97;ctx.shadowColor=focus?"#f4e8b7":"#f7f3ea";ctx.shadowBlur=focus?30:15;ctx.translate(px,1565+bob);ctx.rotate((state.lane-1)*.025+(sprint?.035:0));ctx.drawImage(seekerArt,-145,-200,290,435);ctx.restore()}
      ctx.save();ctx.fillStyle="#f0d480";ctx.font="18px Courier New";ctx.globalAlpha=.75;ctx.fillText("SEEKER 07",px-58,1820);ctx.restore()
    };
    const resetV3=reset;reset=function(){resetV3();state.guideSeen=new Set();state.captionSeen=new Set();state.sprintUntil=0;state.runSpeed=.007;state.v4Last=performance.now();state.paceBursts=0;hideGuide();paceHud.classList.remove("on");memoryCaption.classList.remove("on");updateLanguageChrome()};
    const visualFrameV3=visualFrame;visualFrame=function(t){
      const realDt=Math.min(.05,Math.max(0,(t-state.v4Last)/1000));state.v4Last=t;
      if(state.stage==="corridor"){const wave=Math.sin(t*.0017)*.0008,curve=.0068+state.progress*.0066,sprint=state.sprintUntil>t?.0038:0;state.runSpeed=clamp(curve+wave+sprint,.0058,.017);state.last=t-realDt*(state.runSpeed/.0105)*1000}
      visualFrameV3(t);
      if(state.stage==="corridor"){const focus=state.focusUntil>t,sprint=state.sprintUntil>t,level=focus?0:sprint||state.runSpeed>.0127?2:1;paceLabel.textContent=state.locale==="zh"?(level===0?"聚焦慢行":level===2?"记忆涌流":"记忆漂移"):(level===0?"FOCUS / SLOW":level===2?"MEMORY SURGE":"MEMORY FLOW");[...paceHud.querySelectorAll(".pace-bars i")].forEach((x,i)=>x.classList.toggle("on",i<=level));const marks=[.12,.36,.62,.86];marks.forEach((m,i)=>{if(state.progress>=m&&!state.captionSeen.has(i)){state.captionSeen.add(i);showMemoryCaption(i)}});if(!state.sound.muted&&state.sound.ctx&&t>state.nextMemoryTone){state.sound.blip([392,440,523,587][state.captionSeen.size%4],.8,.018,"sine");state.nextMemoryTone=t+6800}}
    };
    setStage("dormant");requestAnimationFrame(visualFrame);
  </script>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>记忆漂移：完整网页互动版</title>
  <style>
    :root{--paper:#ece7dc;--ink:#29363a;--yellow:#c6aa62;--pale:#f7f3ea;--violet:#a59dab}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#899396;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none}
    body{display:grid;place-items:center}.game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);overflow:hidden;background:#b6c0c0;box-shadow:0 2rem 6rem #25313666}
    canvas{position:absolute;inset:0;width:100%;height:100%}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#26333755,transparent 20%,transparent 76%,#26333777),radial-gradient(ellipse,transparent 48%,#26333744)}
    header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:5% 6%;color:var(--pale);font:11px/1.6 ui-monospace,monospace;letter-spacing:.12em;text-shadow:0 2px 12px #25313688}header b{display:block;font-weight:500}.chip{padding:.35rem .65rem;border:1px solid #f7f3ea77;border-radius:999px;background:#29363a33}
    .center{position:absolute;left:8%;right:8%;bottom:17%;text-align:center;color:var(--pale);text-shadow:0 3px 18px #25313699}.center h1{margin:.4rem 0;font:400 clamp(54px,14vw,108px)/.78 Georgia,serif;letter-spacing:-.05em}.center p{margin:.7rem 0;letter-spacing:.08em}
    .panel{position:absolute;left:8%;right:8%;bottom:17%;padding:1rem;border:1px solid #f7f3ea66;background:#ece7dccc;backdrop-filter:blur(16px);box-shadow:0 1rem 2rem #25313633}.panel h2{margin:.45rem 0;font:400 clamp(21px,4vw,34px)/1.2 Georgia,"Songti SC",serif}.panel p{margin:.4rem 0;font-size:12px;line-height:1.7}.micro{font:10px/1.5 ui-monospace,monospace;letter-spacing:.12em}
    .slots{position:absolute;right:4%;top:25%;display:grid;gap:.45rem;color:var(--pale);font:10px ui-monospace,monospace}.slots i{display:grid;width:22px;height:22px;place-items:center;border:1px solid #f7f3ea66;transform:rotate(45deg);font-style:normal}.slots i.on{background:var(--yellow);color:var(--ink)}.slots i span{transform:rotate(-45deg)}
    .lanes{position:absolute;left:50%;bottom:15%;display:flex;gap:.55rem;transform:translateX(-50%)}.lanes i{width:35px;height:3px;background:#f7f3ea44}.lanes i.on{background:var(--pale);box-shadow:0 0 12px var(--pale)}
    footer{position:absolute;left:6%;right:6%;bottom:3.5%;color:var(--pale);font:10px ui-monospace,monospace;letter-spacing:.07em}.prompt{margin-bottom:.55rem}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:center}.track{height:4px;background:#f7f3ea33;overflow:hidden}.fill{display:block;height:100%;background:var(--yellow);transform:scaleX(0);transform-origin:left;transition:transform .25s}
    .toast{position:absolute;top:16%;left:12%;right:12%;padding:.65rem;text-align:center;color:var(--pale);background:#29363abb;border:1px solid #f7f3ea55;font:11px/1.5 ui-monospace,monospace;letter-spacing:.08em;opacity:0;transform:translateY(-8px);transition:.25s}.toast.on{opacity:1;transform:none}
    .controls{position:absolute;left:50%;bottom:8%;display:none;gap:.35rem;transform:translateX(-50%);z-index:5}.controls button{height:36px;min-width:36px;border:1px solid #f7f3ea77;border-radius:50%;background:#29363a88;color:#fff}.controls .scan{width:58px;border-radius:999px;color:#f1d57e}.hidden{display:none!important}
    .choice-list{display:grid;gap:.45rem;margin:.8rem 0}.choice-row{display:grid;grid-template-columns:4.3rem 1fr 1fr;gap:.35rem;align-items:center}.choice-row span,.choice-row b{padding:.5rem .3rem;border:1px solid #29363a33;text-align:center;font-size:11px;font-weight:400}.choice-row b.on{border-color:var(--yellow);background:#c6aa6233}.choice-row.done span:first-child::after{content:"  ✓";color:#8c783f}.fragment-list{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin:.8rem 0}.fragment-list b{padding:.55rem .15rem;border:1px solid #29363a33;text-align:center;font:10px ui-monospace,monospace}.fragment-list b.on{border-color:var(--yellow);background:#c6aa6233}.fragment-list b.done{background:#8ea09a55}.version-list{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.8rem 0}.version-list article{padding:.65rem;border:1px solid #29363a33}.version-list article.on{border-color:var(--yellow);background:#c6aa6226}.version-list h3{margin:0 0 .35rem;font:18px Georgia,serif}.version-list p{font-size:10px;line-height:1.55}.result{border-left:3px solid var(--yellow);padding-left:.7rem}
    @media(pointer:coarse){.controls{display:flex}.panel{bottom:20%}}
  </style>
</head>
<body>
  <main class="game" id="game">
    <canvas id="scene" width="1080" height="1920"></canvas><div class="veil"></div>
    <header><div>MEMORY ARCHIVE 07<b id="stageLabel">STATUS · 等待接入</b></div><span class="chip" id="status">DORMANT</span></header>
    <section class="center" id="dormant"><span class="micro">MEMORY ARCHIVE 07 · STATUS: DORMANT</span><h1>MEMORY<br>DRIFT</h1><p>移动方向键唤醒档案</p></section>
    <section class="panel hidden" id="panel"></section>
    <aside class="slots hidden" id="slots"><span id="count">00 / 05</span><i><span></span></i><i><span></span></i><i><span></span></i><i><span></span></i><i><span></span></i></aside>
    <div class="lanes hidden" id="lanes"><i></i><i class="on"></i><i></i></div>
    <div class="toast" id="toast"></div>
    <div class="controls"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button><button class="scan" data-key="Space">SCAN</button></div>
    <footer><div class="prompt" id="prompt">方向键 / WASD 唤醒档案</div><div class="bar"><span>WEB INPUT</span><div class="track"><b class="fill" id="fill"></b></div><strong id="ready">READY</strong></div></footer>
  </main>
  <script>
    const canvas=document.querySelector("#scene"),ctx=canvas.getContext("2d");
    const ui={dormant:document.querySelector("#dormant"),panel:document.querySelector("#panel"),slots:document.querySelector("#slots"),count:document.querySelector("#count"),lanes:document.querySelector("#lanes"),prompt:document.querySelector("#prompt"),fill:document.querySelector("#fill"),ready:document.querySelector("#ready"),stage:document.querySelector("#stageLabel"),status:document.querySelector("#status"),toast:document.querySelector("#toast")};
    const anchors=[{x:.72,y:.30,n:"墙上的时钟",note:"时间停在 17:42"},{x:.42,y:.66,n:"桌面姓名标签",note:"名字的后半部分已经褪色"},{x:.63,y:.48,n:"窗边第二个人影",note:"轮廓与玻璃倒影重合"}];
    const fragments=[{id:4,lane:0,at:.35,n:"声音波形 · 等我一下……"},{id:5,lane:2,at:.72,n:"照片中央缺失部分"}];
    const blanks=[{lane:1,at:.18},{lane:0,at:.52},{lane:2,at:.82}];
    const coordinates=[{label:"时间",values:["17:42","18:12"]},{label:"地点",values:["B-307","A-307"]},{label:"人物",values:["2 人","1 人"]}];
    const pieces=[
      {name:"照片角",values:["窗边轮廓","玻璃反射"]},
      {name:"时钟",values:["17:42","18:12"]},
      {name:"姓名牌",values:["同伴姓名","记录者自注"]},
      {name:"声音",values:["另一个人","旧录音"]},
      {name:"缺口",values:["模糊人物","空椅子"]}
    ];
    const state={stage:"dormant",scanner:{x:.5,y:.5},read:new Set(),collected:new Set(),lane:1,progress:0,pulse:0,cycle:0,hits:new Set(),door:1,calIndex:0,calibration:[0,0,0],calibrated:new Set(),pieceIndex:0,pieceVersions:[0,0,0,0,0],placed:new Set(),version:0,finalVersion:0,bias:0,finalAt:0,last:performance.now(),timer:0,audio:null};
    const clamp=(n,a=0,b=1)=>Math.min(b,Math.max(a,n));
    function tone(f=640,d=.08){try{if(!state.audio)state.audio=new(window.AudioContext||window.webkitAudioContext)();const a=state.audio,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
    function say(s){ui.toast.textContent=s;ui.toast.classList.add("on");clearTimeout(state.timer);state.timer=setTimeout(()=>ui.toast.classList.remove("on"),1800)}
    function nearest(){return anchors.map((a,i)=>Object.assign({i:i,d:Math.hypot(a.x-state.scanner.x,(a.y-state.scanner.y)*.7)},a)).sort((a,b)=>a.d-b.d)[0]}
    function setStage(s){state.stage=s;ui.dormant.classList.toggle("hidden",s!=="dormant");ui.panel.classList.toggle("hidden",!["archive","doors","classroom","reconstruct","versions","finale"].includes(s));ui.slots.classList.toggle("hidden",!["archive","corridor","classroom","reconstruct"].includes(s));ui.lanes.classList.toggle("hidden",s!=="corridor");const m={dormant:["STATUS · 等待接入","DORMANT"],archive:["01 / STABLE ARCHIVE · 档案扫描","STABLE"],corridor:["02 / MEMORY DRIFT · 三轨走廊","DRIFT"],doors:["02 / EXIT QUERY · 三扇门","CHECKPOINT"],classroom:["03 / CORRUPTED CLASSROOM · 循环教室","CORRUPTED"],reconstruct:["04 / RECONSTRUCTION · 碎片重组","DRIFT"],versions:["05 / MULTIPLE VERSION · 双版本","UNKNOWN"],finale:["06 / MEMORY RESTORED · 结局","ALTERED"]}[s];ui.stage.textContent=m[0];ui.status.textContent=m[1];renderUI()}
    function renderUI(){
      if(state.stage==="dormant"){ui.prompt.textContent="方向键 / WASD 唤醒档案";ui.ready.textContent="READY";ui.fill.style.transform="scaleX(0)"}
      if(state.stage==="archive"){const a=nearest();ui.panel.innerHTML="<span class=micro>ANCHOR "+(state.read.size+1)+" / 03</span><h2>"+(a.d<.13?a.n:"移动扫描框寻找异常")+"</h2><p>"+(a.d<.13?(state.read.has(a.i)?"READ · 已写入记忆链":"ANOMALY · 按空格扫描并读取"):"靠近线索时扫描框会改变颜色。")+"</p>";ui.prompt.textContent="方向键移动扫描框 · 空格扫描并收集";ui.ready.textContent=a.d<.13?"ANCHOR FOUND":"SCAN READY";ui.fill.style.transform="scaleX("+(state.read.size/3)+")"}
      if(state.stage==="corridor"){ui.prompt.textContent="左右切换轨道 · 上键加速 · 空格扫描/收集";ui.ready.textContent=state.pulse>performance.now()?"SCANNING":"SCAN READY";ui.fill.style.transform="scaleX("+state.progress+")"}
      if(state.stage==="doors"){const n=["A-307","B-307","门牌缺失"];ui.panel.innerHTML="<span class=micro>CORRIDOR CHECKPOINT REACHED</span><h2>走廊尽头的三扇门</h2><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.8rem 0'>"+n.map((x,i)=>"<div style='padding:.7rem .2rem;border:1px solid "+(i===state.door?"#c6aa62":"#29363a44")+";text-align:center'>"+x+"</div>").join("")+"</div><p>根据档案线索选择入口。选择不会判定对错。</p>";ui.prompt.textContent="左右选择门 · 上键或空格确认";ui.ready.textContent="DOOR SELECT";ui.fill.style.transform="scaleX(1)"}
      if(state.stage==="classroom"){const rows=coordinates.map((c,i)=>"<div class='choice-row "+(state.calibrated.has(i)?"done":"")+"'><span>"+c.label+(i===state.calIndex?" ◇":"")+"</span>"+c.values.map((v,j)=>"<b class='"+(state.calibration[i]===j?"on":"")+"'>"+v+"</b>").join("")+"</div>").join("");ui.panel.innerHTML="<span class=micro>LOOP "+String(state.calibrated.size+1).padStart(2,"0")+" · COORDINATE CALIBRATION</span><h2>校准三个记忆坐标</h2><div class=choice-list>"+rows+"</div><p>每个答案都能被现存碎片支持。确认后，教室会再次循环。</p>";ui.prompt.textContent="上下选择坐标 · 左右切换答案 · 空格确认";ui.ready.textContent=state.calibrated.has(state.calIndex)?"CALIBRATED":"CONFIRM";ui.fill.style.transform="scaleX("+(state.calibrated.size/3)+")"}
      if(state.stage==="reconstruct"){const p=pieces[state.pieceIndex];ui.panel.innerHTML="<span class=micro>RECONSTRUCTING MEMORY · "+state.placed.size+" / 05</span><h2>把碎片放回照片缺口</h2><div class=fragment-list>"+pieces.map((x,i)=>"<b class='"+(i===state.pieceIndex?"on ":"")+(state.placed.has(i)?"done":"")+"'>0"+(i+1)+"<br>"+x.name+"</b>").join("")+"</div><p><strong>当前解释：</strong>"+p.values[state.pieceVersions[state.pieceIndex]]+"<br>这枚碎片可以放入两个同样合理的位置。</p>";ui.prompt.textContent="左右选择碎片 · 上下切换解释 · 空格放置";ui.ready.textContent=state.placed.has(state.pieceIndex)?"PLACED":"PLACE FRAGMENT";ui.fill.style.transform="scaleX("+(state.placed.size/5)+")"}
      if(state.stage==="versions"){const lean=Math.abs(state.bias)<=1?"证据保持平衡":state.bias>0?"你的操作偏向共同记忆":"你的操作偏向个人重构";ui.panel.innerHTML="<span class=micro>MULTIPLE VERSION · ORIGINAL MEMORY UNKNOWN</span><h2>请选择你愿意保存的版本</h2><div class=version-list><article class='"+(state.version===0?"on":"")+"'><h3>Version A</h3><p>17:42 · B-307 · 2 人<br>共同离开 · 他人拍摄<br>“等我一下”来自另一个人</p></article><article class='"+(state.version===1?"on":"")+"'><h3>Version B</h3><p>18:12 · B-307 · 1 人<br>独自离开 · 定时拍摄<br>声音来自另一段旧录音</p></article></div><p>两个版本均符合现存证据。<br><strong>行为分析：</strong>"+lean+"。</p>";ui.prompt.textContent="左右切换 Version A / B · 空格保存";ui.ready.textContent="SAVE VERSION";ui.fill.style.transform="scaleX(1)"}
      if(state.stage==="finale"){const v=state.finalVersion===0?"Version A · 共同记忆":"Version B · 个人重构",cred=Math.max(63,88-Math.min(20,Math.abs(state.bias)*2));ui.panel.innerHTML="<span class=micro>MEMORY RESTORED · BUT ALTERED</span><h2>记忆已恢复<br>但已发生改变</h2><p class=result>你没有找回原始记忆。<br>你完成了一次新的记忆保存。</p><p>碎片：05 / 05<br>记忆校准：03 / 03<br>保存版本："+v+"<br>档案可信度："+cred+"%</p><p class=micro>ORIGINAL MEMORY: UNKNOWN · 原始记忆：无法确认</p>";ui.prompt.textContent="10 秒后自动返回待机 · R 立即重置";ui.ready.textContent="ALTERED";ui.fill.style.transform="scaleX(1)"}
      ui.count.textContent=String(state.collected.size).padStart(2,"0")+" / 05";[...ui.slots.querySelectorAll("i")].forEach((el,i)=>{el.classList.toggle("on",state.collected.has(i+1));el.querySelector("span").textContent=state.collected.has(i+1)?i+1:""});[...ui.lanes.children].forEach((el,i)=>el.classList.toggle("on",i===state.lane));
    }
    function scan(){const now=performance.now();state.pulse=now+1000;tone(760,.1);
      if(state.stage==="archive"){const a=nearest();if(a.d>.13){say("SIGNAL LOST · 将扫描框移近异常区域");return}if(!state.read.has(a.i)){state.read.add(a.i);state.collected.add(a.i+1);tone(980,.16);say("FRAGMENT 0"+(a.i+1)+" · "+a.note);if(state.read.size===3)setTimeout(()=>{state.progress=0;setStage("corridor");say("ARCHIVE OPENED · 记忆走廊已生成")},1100)}else say("该锚点已经写入记忆链")}
      else if(state.stage==="corridor"){const f=fragments.find(x=>!state.collected.has(x.id)&&x.lane===state.lane&&Math.abs(x.at-state.progress)<.13);if(f){state.collected.add(f.id);tone(980,.16);say("FRAGMENT 0"+f.id+" · "+f.n)}else say("扫描波已发出 · 寻找具有完整影子的物体")}
      else if(state.stage==="doors"){state.bias+=state.door===0?-1:state.door===1?1:0;state.calibration=state.door===0?[1,1,1]:state.door===2?[1,0,1]:[0,0,0];setStage("classroom");tone(840,.2);say("LEVEL 03 · 教室正在循环")}
      else if(state.stage==="classroom"){if(state.calibrated.has(state.calIndex)){say("该坐标已经锁定 · 请选择下一项")}else{state.calibrated.add(state.calIndex);state.bias+=state.calibration[state.calIndex]===0?1:-1;tone(920,.16);say(coordinates[state.calIndex].label+" · "+coordinates[state.calIndex].values[state.calibration[state.calIndex]]+" 已锁定");if(state.calibrated.size===3){setTimeout(()=>{setStage("reconstruct");say("五枚碎片已展开 · 每枚都有两种解释")},900)}else{const next=[0,1,2].find(i=>!state.calibrated.has(i));if(next!==undefined)state.calIndex=next}}}
      else if(state.stage==="reconstruct"){if(state.placed.has(state.pieceIndex)){say("该碎片已经放入照片")}else{state.placed.add(state.pieceIndex);state.bias+=state.pieceVersions[state.pieceIndex]===0?1:-1;tone(960,.18);say("FRAGMENT 0"+(state.pieceIndex+1)+" · "+pieces[state.pieceIndex].values[state.pieceVersions[state.pieceIndex]]);if(state.placed.size===5){setTimeout(()=>{state.version=state.bias<0?1:0;setStage("versions");say("两个版本均符合现存证据")},1000)}else{const next=[0,1,2,3,4].find(i=>!state.placed.has(i));if(next!==undefined)state.pieceIndex=next}}}
      else if(state.stage==="versions"){state.finalVersion=state.version;state.finalAt=performance.now();setStage("finale");tone(state.version===0?720:610,.28);say("MEMORY RESTORED · BUT ALTERED")}renderUI()}
    function reset(){ui.toast.classList.remove("on");ui.toast.textContent="";clearTimeout(state.timer);Object.assign(state,{stage:"dormant",scanner:{x:.5,y:.5},read:new Set(),collected:new Set(),lane:1,progress:0,pulse:0,cycle:0,hits:new Set(),door:1,calIndex:0,calibration:[0,0,0],calibrated:new Set(),pieceIndex:0,pieceVersions:[0,0,0,0,0],placed:new Set(),version:0,finalVersion:0,bias:0,finalAt:0,last:performance.now()});setStage("dormant")}
    function action(k){if(state.stage==="dormant"&&k.startsWith("Arrow")){setStage("archive");say("LEVEL 01 · 找到三个记忆锚点");tone();return}if(k==="Space"){scan();return}if(k==="KeyR"){reset();return}
      if(state.stage==="archive"){if(k==="ArrowLeft")state.scanner.x=clamp(state.scanner.x-.055,.1,.9);if(k==="ArrowRight")state.scanner.x=clamp(state.scanner.x+.055,.1,.9);if(k==="ArrowUp")state.scanner.y=clamp(state.scanner.y-.055,.18,.75);if(k==="ArrowDown")state.scanner.y=clamp(state.scanner.y+.055,.18,.75)}
      else if(state.stage==="corridor"){if(k==="ArrowLeft")state.lane=Math.max(0,state.lane-1);if(k==="ArrowRight")state.lane=Math.min(2,state.lane+1);if(k==="ArrowUp")state.progress=Math.min(.995,state.progress+.035);if(k==="ArrowDown")state.progress=Math.max(0,state.progress-.018)}
      else if(state.stage==="doors"){if(k==="ArrowLeft")state.door=Math.max(0,state.door-1);if(k==="ArrowRight")state.door=Math.min(2,state.door+1);if(k==="ArrowUp")scan()}
      else if(state.stage==="classroom"){if(k==="ArrowUp")state.calIndex=Math.max(0,state.calIndex-1);if(k==="ArrowDown")state.calIndex=Math.min(2,state.calIndex+1);if(k==="ArrowLeft")state.calibration[state.calIndex]=0;if(k==="ArrowRight")state.calibration[state.calIndex]=1}
      else if(state.stage==="reconstruct"){if(k==="ArrowLeft")state.pieceIndex=Math.max(0,state.pieceIndex-1);if(k==="ArrowRight")state.pieceIndex=Math.min(4,state.pieceIndex+1);if(k==="ArrowUp"||k==="ArrowDown")state.pieceVersions[state.pieceIndex]=1-state.pieceVersions[state.pieceIndex]}

    const keyMap={KeyA:"ArrowLeft",KeyD:"ArrowRight",KeyW:"ArrowUp",KeyS:"ArrowDown"};addEventListener("keydown",e=>{const k=keyMap[e.code]||e.code;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(k))e.preventDefault();if(!e.repeat)action(k)});document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("pointerdown",()=>action(b.dataset.key)));

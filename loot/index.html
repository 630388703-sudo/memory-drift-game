<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>记忆漂移：LOOT 交互验证版</title>
  <style>
    :root{--paper:#ece7dc;--ink:#29363a;--blue:#718791;--violet:#a59dab;--yellow:#c6aa62;--pale:#f7f3ea}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#899396;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    body{display:grid;place-items:center}.game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);overflow:hidden;background:#c3c7c4;box-shadow:0 2rem 6rem #25313666}
    canvas{position:absolute;inset:0;width:100%;height:100%}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#26333755,transparent 20%,transparent 76%,#26333777),radial-gradient(ellipse,transparent 48%,#26333744)}
    header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:5% 6%;color:var(--pale);font:11px/1.6 ui-monospace,monospace;letter-spacing:.12em;text-shadow:0 2px 12px #25313688}
    header b{display:block;font-weight:500}.chip{align-self:flex-start;padding:.35rem .65rem;border:1px solid #f7f3ea77;border-radius:999px;background:#29363a33}
    .center{position:absolute;left:8%;right:8%;bottom:16%;text-align:center;color:var(--pale);text-shadow:0 3px 18px #25313699}.center h1{margin:.4rem 0;font:400 clamp(54px,14vw,108px)/.78 Georgia,serif;letter-spacing:-.05em}.center p{margin:.5rem 0;letter-spacing:.08em}
    .panel{position:absolute;left:8%;right:8%;bottom:15%;padding:1rem;border:1px solid #f7f3ea66;background:#ece7dccc;backdrop-filter:blur(16px);box-shadow:0 1rem 2rem #25313633}.panel h2{margin:.45rem 0;font:400 clamp(22px,4vw,36px)/1.2 Georgia,"Songti SC",serif}.panel p{margin:.4rem 0;font-size:12px;line-height:1.7}.micro{font:10px/1.5 ui-monospace,monospace;letter-spacing:.12em}
    .slots{position:absolute;right:4%;top:26%;display:grid;gap:.45rem;color:var(--pale);font:10px ui-monospace,monospace}.slots i{display:grid;width:22px;height:22px;place-items:center;border:1px solid #f7f3ea66;transform:rotate(45deg);font-style:normal}.slots i.on{background:var(--yellow);color:var(--ink)}
    footer{position:absolute;left:6%;right:6%;bottom:4%;color:var(--pale);font:10px ui-monospace,monospace;letter-spacing:.07em}.prompt{margin-bottom:.65rem}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:center}.track{position:relative;height:5px;background:#f7f3ea33;overflow:hidden}.track:after{position:absolute;left:30%;width:40%;height:100%;background:#b6c58c77;content:""}.fill{position:absolute;z-index:2;inset:0;background:var(--yellow);transform:scaleX(0);transform-origin:left}.lanes{position:absolute;left:50%;bottom:14%;display:flex;gap:.55rem;transform:translateX(-50%)}.lanes i{width:35px;height:3px;background:#f7f3ea44}.lanes i.on{background:var(--pale);box-shadow:0 0 12px var(--pale)}
    .versions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.9rem 0}.versions div{padding:.7rem;border:1px solid #29363a33;opacity:.45}.versions div.on{border-color:var(--yellow);background:#c6aa6222;opacity:1}.versions strong,.versions small{display:block}.versions strong{font:400 20px Georgia,serif}.versions small{margin-top:.35rem;font-size:10px;line-height:1.5}.hidden{display:none}
  </style>
</head>
<body>
  <main class="game" id="game" data-stage="dormant">
    <canvas id="scene" width="1080" height="1920"></canvas><div class="veil"></div>
    <header><div>MEMORY ARCHIVE 07<b id="stageLabel">STATUS · 等待接入</b></div><span class="chip" id="status">DORMANT</span></header>
    <section class="center" id="dormant"><span class="micro">MEMORY ARCHIVE 07 · STATUS: DORMANT</span><h1>MEMORY<br>DRIFT</h1><p>移动摇杆唤醒档案</p></section>
    <section class="panel hidden" id="panel"></section>
    <aside class="slots hidden" id="slots"><span id="count">00 / 05</span><i></i><i></i><i></i><i></i><i></i></aside>
    <div class="lanes hidden" id="lanes"><i></i><i class="on"></i><i></i></div>
    <footer><div class="prompt" id="prompt">移动方向键唤醒档案</div><div class="bar"><span>PRESSURE</span><div class="track"><b class="fill" id="fill"></b></div><strong id="pressure">UNSTABLE</strong></div></footer>
  </main>
  <script>
    const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
    const ui={game:document.querySelector('#game'),dormant:document.querySelector('#dormant'),panel:document.querySelector('#panel'),slots:document.querySelector('#slots'),count:document.querySelector('#count'),lanes:document.querySelector('#lanes'),prompt:document.querySelector('#prompt'),fill:document.querySelector('#fill'),pressure:document.querySelector('#pressure'),stage:document.querySelector('#stageLabel'),status:document.querySelector('#status')};
    const anchors=[{x:.72,y:.31,n:'墙上的时钟'},{x:.43,y:.66,n:'桌面姓名标签'},{x:.63,y:.48,n:'第二个人影'}];
    const state={stage:'dormant',scanner:{x:.5,y:.5},scanned:new Set(),read:new Set(),collected:new Set(),lane:1,progress:0,bias:0,down:0,held:0,pulse:0,version:'A',finalAt:0};
    const clamp=(n,a=0,b=1)=>Math.min(b,Math.max(a,n));
    function pressureRatio(ms){if(ms<360)return ms/360*.3;if(ms<2300)return .3+(ms-360)/1940*.4;return .7+clamp((ms-2300)/1300)*.3}
    function nearest(){return anchors.map((a,i)=>({...a,i,d:Math.hypot(a.x-state.scanner.x,(a.y-state.scanner.y)*.7)})).sort((a,b)=>a.d-b.d)[0]}
    function setStage(stage){state.stage=stage;ui.game.dataset.stage=stage;ui.dormant.classList.toggle('hidden',stage!=='dormant');ui.panel.classList.toggle('hidden',!['archive','versions','finale'].includes(stage));ui.slots.classList.toggle('hidden',!['archive','corridor'].includes(stage));ui.lanes.classList.toggle('hidden',stage!=='corridor');
      const meta={dormant:['STATUS · 等待接入','DORMANT'],archive:['01 / STABLE ARCHIVE · 档案扫描','STABLE'],corridor:['02 / MEMORY DRIFT · 三轨走廊','DRIFT'],versions:['03 / MULTIPLE VERSION · 版本比较','UNKNOWN'],finale:['04 / ARCHIVE SAVED · 结局','ALTERED']}[stage];ui.stage.textContent=meta[0];ui.status.textContent=meta[1];renderPanel()}
    function renderPanel(){
      if(state.stage==='archive'){const a=nearest();ui.panel.innerHTML=`<span class="micro">ANCHOR ${state.read.size+1} / 03</span><h2>${a.d<.13?a.n:'移动扫描框寻找异常'}</h2><p>${a.d<.13?(state.read.has(a.i)?'READ · 已写入记忆链':state.scanned.has(a.i)?'FOUND · 稳定按住读取':'ANOMALY · 短按扫描'):'边缘噪点会在靠近线索时增强'}</p>`;ui.prompt.textContent='方向键移动扫描框 · 短按扫描 · 稳定按住读取'}
      if(state.stage==='versions'){ui.panel.innerHTML=`<span class="micro">两个版本均符合现存证据</span><h2>请选择愿意保存的版本</h2><div class="versions"><div class="${state.version==='A'?'on':''}"><strong>Version A</strong><small>17:42 · B-307 · 两个人一起离开</small></div><div class="${state.version==='B'?'on':''}"><strong>Version B</strong><small>18:12 · B-307 · 一个人独自离开</small></div></div><p>ORIGINAL MEMORY: UNKNOWN</p>`;ui.prompt.textContent='左右切换版本 · 空格保存'}
      if(state.stage==='finale'){ui.panel.innerHTML=`<span class="micro">VERSION ${state.version} SAVED</span><h2>MEMORY RESTORED<br>BUT ALTERED</h2><p>你没有找回原始记忆。<br>你完成了一次新的记忆保存。</p><p class="micro">ORIGINAL MEMORY: UNKNOWN</p>`;ui.prompt.textContent='10 秒后自动返回待机'}
      ui.count.textContent=String(state.collected.size).padStart(2,'0')+' / 05';[...ui.slots.querySelectorAll('i')].forEach((el,i)=>{el.classList.toggle('on',state.collected.has(i+1));el.textContent=state.collected.has(i+1)?i+1:''});[...ui.lanes.children].forEach((el,i)=>el.classList.toggle('on',i===state.lane));
    }
    function pressureEnd(ms){const kind=ms<650?'scan':ms<2300?'focus':'overload';state.down=0;state.held=0;if(kind==='overload')state.bias--;
      if(state.stage==='archive'){const a=nearest();if(a.d>.13)return;if(kind==='scan'){state.scanned.add(a.i);state.pulse=performance.now()+1200}else if(state.scanned.has(a.i)){state.read.add(a.i);state.collected.add(a.i+1);state.bias+=kind==='focus'?1:-1;if(state.read.size===3)setTimeout(()=>setStage('corridor'),700)}}
      else if(state.stage==='corridor'){state.pulse=performance.now()+1200;const fs=[{id:4,lane:0,at:.35},{id:5,lane:2,at:.72}];const f=fs.find(x=>x.lane===state.lane&&Math.abs(x.at-state.progress)<(kind==='overload'?.22:.14));if(f){state.collected.add(f.id);state.bias+=kind==='focus'?1:-1}}
      else if(state.stage==='versions'){setStage('finale');state.finalAt=performance.now()}
      renderPanel()}
    addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS'].includes(e.code))e.preventDefault();if(e.code==='Space'){if(!state.down)state.down=performance.now();return}const key={KeyA:'ArrowLeft',KeyD:'ArrowRight',KeyW:'ArrowUp',KeyS:'ArrowDown'}[e.code]||e.code;if(state.stage==='dormant'&&key.startsWith('Arrow')){setStage('archive');return}if(state.stage==='archive'){if(key==='ArrowLeft')state.scanner.x=clamp(state.scanner.x-.055,.1,.9);if(key==='ArrowRight')state.scanner.x=clamp(state.scanner.x+.055,.1,.9);if(key==='ArrowUp')state.scanner.y=clamp(state.scanner.y-.055,.18,.75);if(key==='ArrowDown')state.scanner.y=clamp(state.scanner.y+.055,.18,.75)}else if(state.stage==='corridor'){if(key==='ArrowLeft')state.lane=Math.max(0,state.lane-1);if(key==='ArrowRight')state.lane=Math.min(2,state.lane+1);if(key==='ArrowUp')state.progress=Math.min(1.01,state.progress+.02)}else if(state.stage==='versions'){if(key==='ArrowLeft')state.version='A';if(key==='ArrowRight')state.version='B'}renderPanel()});
    addEventListener('keyup',e=>{if(e.code==='Space'&&state.down)pressureEnd(performance.now()-state.down)});
    function photo(t){const w=1080,h=1920,g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#aebabc');g.addColorStop(.5,'#d9d5cc');g.addColorStop(1,'#9a9e9d');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ece7dc';ctx.fillRect(90,300,900,1040);ctx.fillStyle='#78909a99';ctx.fillRect(140,350,470,500);ctx.strokeStyle='#f7f3eabb';ctx.lineWidth=8;ctx.strokeRect(140,350,470,500);ctx.fillStyle='#29363a77';ctx.strokeStyle='#29363aaa';ctx.strokeRect(740,420,170,600);ctx.beginPath();ctx.arc(760,365,55,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#29363a55';ctx.beginPath();ctx.arc(540,785,60,0,Math.PI*2);ctx.fill();ctx.fillRect(470,840,140,320);ctx.globalAlpha=.18+.08*Math.sin(t*.001);ctx.fillRect(625,840,130,320);ctx.globalAlpha=1;ctx.fillStyle='#f7f3eadd';ctx.beginPath();ctx.moveTo(465,650);ctx.lineTo(650,590);ctx.lineTo(690,1030);ctx.lineTo(505,1100);ctx.fill();if(state.stage==='archive'){ctx.strokeStyle='#f7f3ea';ctx.setLineDash([18,12]);ctx.lineWidth=6;ctx.beginPath();ctx.arc(state.scanner.x*w,state.scanner.y*h,105,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);if(state.pulse>t){ctx.globalAlpha=(state.pulse-t)/1200;ctx.beginPath();ctx.arc(state.scanner.x*w,state.scanner.y*h,180+(state.pulse-t)*.3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}}}
    function corridor(t){const w=1080,h=1920,hy=520,fy=1690;const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#aebabc');g.addColorStop(1,'#8c9392');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ddd8cdcc';ctx.beginPath();ctx.moveTo(350,hy);ctx.lineTo(730,hy);ctx.lineTo(900,fy);ctx.lineTo(180,fy);ctx.fill();ctx.strokeStyle='#29363a44';for(let i=0;i<10;i++){const z=((i/10+state.progress*.45)%1)**2,y=hy+z*(fy-hy);ctx.beginPath();ctx.moveTo(540-(150+z*330),y);ctx.lineTo(540+(150+z*330),y);ctx.stroke()}const lx=l=>540+(l-1)*270;for(let l=0;l<3;l++){ctx.setLineDash([15,24]);ctx.beginPath();ctx.moveTo(540,hy);ctx.lineTo(lx(l),fy);ctx.stroke()}ctx.setLineDash([]);for(const f of [{id:4,lane:0,at:.35},{id:5,lane:2,at:.72}]){if(state.collected.has(f.id))continue;const d=f.at-state.progress;if(d<-.08||d>.5)continue;const c=1-clamp((d+.08)/.58),y=hy+c*c*(fy-hy)*.8,x=540+(f.lane-1)*270*c;ctx.fillStyle=state.pulse>t?'#f7efd0':'#a59dab';ctx.save();ctx.translate(x,y);ctx.rotate(t*.001);ctx.fillRect(-35-c*35,-35-c*35,70+c*70,70+c*70);ctx.restore()}ctx.fillStyle='#f7f3ea';ctx.beginPath();ctx.arc(lx(state.lane),1530,48,0,Math.PI*2);ctx.fill();ctx.fillRect(lx(state.lane)-58,1580,116,190)}
    function frame(t){state.held=state.down?t-state.down:0;const r=pressureRatio(state.held);ui.fill.style.transform=`scaleX(${r})`;ui.pressure.textContent=!state.down||r<.3?'UNSTABLE':r<.7?'FOCUS':'OVERLOAD';if(state.stage==='corridor'){state.progress+=.00018*(state.down&&r>=.3&&r<.7?.3:1);if(state.progress>=1){if(state.collected.size===5)setStage('versions');else state.progress=.03}}if(state.stage==='finale'&&t-state.finalAt>10000){Object.assign(state,{stage:'dormant',scanner:{x:.5,y:.5},scanned:new Set(),read:new Set(),collected:new Set(),lane:1,progress:0,bias:0,down:0,held:0,pulse:0,version:'A',finalAt:0});setStage('dormant')}if(state.stage==='corridor')corridor(t);else photo(t);requestAnimationFrame(frame)}
    setStage('dormant');requestAnimationFrame(frame);
  </script>
</body>
</html>
